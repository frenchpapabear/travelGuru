<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Guru</title>
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>
    <div id="container">
        <header>
            <h1>Travel Guru</h1>
            <nav>
                <ul>
                    <li><a href="home.html">Home</a></li>
                    <li><a href="about_us.html">About Us</a></li>
                    <li><a href="#" class="on">Contact Us</a></li>
                </ul>
            </nav>
        </header>
        <div class="main">
            <section class="socialMedia">
                <ul>
                    <li><span class="icon icon-twitter"></span></li>
                    <li><span class="icon icon-facebook"></span></li>
                    <li><span class="icon icon-insta"></span></li>
                    <li><span class="icon icon-youtube"></span></li>
                </ul>
            </section>
            <section class="content">
                <h2>Contact us</h2>
                <p>Keep in Touch</p>
            </section>
            <section class="contactForm">
                <form action="">
                    <fieldset>
                        <label for="name">Name</label>
                        <input type="text" name="name">
                        <label for="email">Email</label>
                        <input type="text" name="email">
                        <label for="message">Your Message</label>
                        <textarea name="message" id="message" rows="10"></textarea>
                    </fieldset>
                    <button>Send</button>
                </form>
            </section>
        </div>
    </div>
</body>
</html>
